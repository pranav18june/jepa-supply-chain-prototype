[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-sensitive-jepa"
version = "0.1.0"
description = "Prototype for Risk-Sensitive Decision Alignment in JEPA Supply Chain Planning"
readme = "README.md"
authors = [{ name = "Research Prototype" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyarrow>=18.0.0",
    "huggingface-hub>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
